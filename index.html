<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181818">
  <meta name="description" content="时光：说一句刚刚做了什么，记录每一天的时间，回顾统计，安排未来。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>时光 · 时间手记</title>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <aside class="sidebar">
    <a href="#today" class="brand" aria-label="时光首页"><span class="brand-mark">◷</span><span>时光</span></a>
    <p class="nav-caption">我的时间</p>
    <nav id="navigation" aria-label="主导航"></nav>

    <div id="banner"></div><main id="main" tabindex="-1"><div class="loading">正在打开你的时间手记…</div></main>

  <dialog id="modal"><div id="modal-content"></div></dialog>

  <script src="./core.js"></script><script src="./app.js"></script>
